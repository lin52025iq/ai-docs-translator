<!-- only displayed in mobile; be sure to update version-switcher.html too -->
<div class="version-switcher">
    <a href="{{ '/versions/' | url }}" class="switcher-fallback">{{ site.docs_ui.versions }}</a>

    <div hidden role="region" class="switcher switcher--version" aria-labelledby="nav-version-switcher-label" id="nav-version-switcher">
        <span id="nav-version-switcher-label" hidden>{{ site.docs_ui.versions }}</span>
        <div class="infobox visually-hidden" id="nav-version-infobox">
            {{ site.docs_ui.version_hint }}
        </div>

        <label class="switcher__label label--block" for="version-select">
            <span class="label__text">{{ site.docs_ui.version }}</span>
        </label>
        <select name="version selector" id="nav-version-select" aria-describedby="nav-version-infobox" class="c-custom-select switcher__select auto-switcher">
            {% for item in eslintVersions.items %}
            <option value="{{ item.version }}" data-url="{{ item.path }}" {% if item.selected %}selected{% endif %}>{{ item.display }}</option>
            {% endfor %}
            <option value="Previous Versions" data-url="https://eslint.org/version-support">{{ site.docs_ui.previous_versions }}</option>
        </select>
    </div>
</div>
