name: 创建翻译项目

on:
    workflow_dispatch:
        inputs:
            project_id:
                description: 项目 ID（小写字母、数字和连字符）
                required: true
                type: string
            source_repository:
                description: 上游仓库（owner/repository）
                required: true
                type: string
            source_ref:
                description: 上游分支、标签或提交
                default: main
                type: string
            source_language:
                description: 源语言，auto 表示自动识别
                default: auto
                type: string
            target_locales:
                description: 目标语言，用空格或逗号分隔
                default: zh-CN
                type: string

permissions:
    contents: write

concurrency:
    group: translation-${{ inputs.project_id }}
    cancel-in-progress: false

jobs:
    create:
        runs-on: ubuntu-latest
        steps:
            - name: 检出翻译管理仓库
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}

            - name: 配置 Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: 配置 pnpm
              uses: pnpm/action-setup@v6

            - name: 安装管理仓库依赖
              run: pnpm install --frozen-lockfile

            - name: 创建并推送项目配置分支
              env:
                  PROJECT_ID: ${{ inputs.project_id }}
                  SOURCE_REPOSITORY: ${{ inputs.source_repository }}
                  SOURCE_REF: ${{ inputs.source_ref }}
                  SOURCE_LANGUAGE: ${{ inputs.source_language }}
                  TARGET_LOCALES: ${{ inputs.target_locales }}
              run: |
                  read -r -a locales <<< "${TARGET_LOCALES//,/ }"
                  pnpm translator create-project \
                      --name "$PROJECT_ID" \
                      --source-repository "$SOURCE_REPOSITORY" \
                      --ref "$SOURCE_REF" \
                      --source-language "$SOURCE_LANGUAGE" \
                      --locale "${locales[@]}" \
                      --push
                  printf '## 项目创建完成\n\n配置分支：`%s-config`\n\n下一步：配置项目的上游仓库 Secret，再运行「项目文档翻译」。\n' "$PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
