name: 项目文档翻译

on:
    workflow_dispatch:
        inputs:
            project_id:
                description: 项目 ID（读取对应的配置分支）
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: translation-${{ inputs.project_id }}
    cancel-in-progress: false

jobs:
    translate:
        runs-on: ubuntu-latest
        env:
            PROJECT_CONFIG: .translation-config/config.yml
            PROJECT_ID: ${{ inputs.project_id }}
        steps:
            - name: 检出翻译管理仓库
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0
                  ssh-key: ${{ secrets.TRANSLATION_REPO_SSH_KEY }}

            - name: 检出项目配置分支
              uses: actions/checkout@v7
              with:
                  ref: ${{ format('{0}-config', inputs.project_id) }}
                  path: .translation-config
                  persist-credentials: false

            - name: 配置 Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: 配置 pnpm
              uses: pnpm/action-setup@v6

            - name: 安装管理仓库依赖
              run: pnpm install --frozen-lockfile

            - name: 校验项目配置
              run: pnpm translator validate --project "$PROJECT_CONFIG"

            - name: 读取上游仓库配置
              id: source
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFile } from 'node:fs/promises'
                  import { loadProject } from './src/project/config.ts'
                  const { config } = await loadProject(process.env.PROJECT_CONFIG)
                  if (config.project.id !== process.env.PROJECT_ID) throw new Error('配置分支与项目 ID 不一致')
                  const secretPrefix = config.project.id.toUpperCase().replaceAll('-', '_')
                  const tokenSecret = `${secretPrefix}_SOURCE_REPO_TOKEN`
                  await appendFile(process.env.GITHUB_OUTPUT, `token_secret=${tokenSecret}\n`)
                  await appendFile(process.env.GITHUB_OUTPUT, `deploy_hook_secret=${secretPrefix}_VERCEL_DEPLOY_HOOK\n`)
                  await appendFile(process.env.GITHUB_OUTPUT, `repository=${config.source.repository}\nref=${config.source.ref}\n`)
                  NODE

            - name: 检查运行凭据
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  SOURCE_REPO_TOKEN: ${{ secrets[steps.source.outputs.token_secret] }}
                  SOURCE_TOKEN_SECRET: ${{ steps.source.outputs.token_secret }}
              run: |
                  if [ -z "$OPENAI_API_KEY" ] || [ -z "$SOURCE_REPO_TOKEN" ]; then
                      echo "请在仓库 Secrets 中配置 OPENAI_API_KEY 和 $SOURCE_TOKEN_SECRET。" >&2
                      exit 1
                  fi

            - name: 检出上游文档仓库
              uses: actions/checkout@v7
              with:
                  repository: ${{ steps.source.outputs.repository }}
                  ref: ${{ steps.source.outputs.ref }}
                  path: .translation-source
                  fetch-depth: 0
                  token: ${{ secrets[steps.source.outputs.token_secret] }}
                  persist-credentials: false

            - name: 顺序执行项目文档翻译
              id: translate
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  mkdir -p .translation-drafts
                  pnpm --silent translator run-project \
                      --project "$PROJECT_CONFIG" \
                      --source-root .translation-source \
                      --repository . \
                      --push \
                      > .translation-drafts/result.json

            - name: 输出翻译结果汇总
              if: ${{ always() }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFile, readFile } from 'node:fs/promises'
                  const content = await readFile('.translation-drafts/result.json', 'utf8').catch((error) => {
                      if (error.code === 'ENOENT') return ''
                      throw error
                  })
                  let summary = '## 项目文档翻译\n\n任务未完成，请查看前序步骤日志。\n'
                  if (content?.trim()) {
                      const result = JSON.parse(content)
                      const rows = Object.entries(result.locales).map(([locale, progress]) =>
                          `| ${locale} | ${progress.completed}/${progress.total} | ${progress.summary.conflict} | ${progress.summary.failed + progress.summary.retryable_failed + progress.summary.blocked} |`
                      )
                      summary = `## 项目文档翻译\n\n${result.status === 'success' ? '翻译完成' : result.status === 'warning' ? '翻译处理完成，异常输出已归档，请人工确认' : '部分完成，仍有失败或未处理文件'}\n\n| 语言 | 已完成/总数 | 冲突 | 失败或阻塞 |\n| --- | --- | --- | --- |\n${rows.join('\n')}\n`
                  }
                  await appendFile(process.env.GITHUB_STEP_SUMMARY, summary)
                  console.log(summary)
                  NODE

            - name: 翻译完成后部署 Tiptap 中文文档
              if: ${{ env.PROJECT_ID == 'tiptap-docs' }}
              env:
                  VERCEL_TOKEN: ${{ secrets.TIPTAP_DOCS_VERCEL_TOKEN }}
              run: |
                  node --input-type=module <<'NODE'
                  import { execFileSync } from 'node:child_process'
                  import { appendFile, readFile } from 'node:fs/promises'
                  const result = JSON.parse(await readFile('.translation-drafts/result.json', 'utf8'))
                  if (result.status !== 'success') {
                      console.log('仍有文件未完成翻译，跳过生产部署。')
                      process.exit(0)
                  }
                  const token = process.env.VERCEL_TOKEN
                  if (!token) throw new Error('请配置 TIPTAP_DOCS_VERCEL_TOKEN 仓库 Secret。')
                  const ref = 'tiptap-docs-zh-cn'
                  const sha = execFileSync('git', ['rev-parse', 'refs/heads/' + ref], { encoding: 'utf8' }).trim()
                  const teamId = 'team_fEBZtKMNvmjodbBzMmTWage5'
                  const project = 'prj_ce2hFlut8p3i4XVFOpTO3smQ0aka'
                  const response = await fetch('https://api.vercel.com/v13/deployments?teamId=' + teamId, {
                      method: 'POST',
                      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          name: 'tiptap-docs',
                          project,
                          target: 'production',
                          gitSource: { type: 'github', repoId: '1448072497', ref, sha }
                      })
                  })
                  if (!response.ok) throw new Error('Vercel 部署请求失败：HTTP ' + response.status)
                  const deployment = await response.json()
                  const message = '已触发 Tiptap 中文文档生产部署：' + deployment.id + '（提交 ' + sha + '）'
                  console.log(message)
                  await appendFile(process.env.GITHUB_STEP_SUMMARY, message + '\n')
                  NODE

            - name: 翻译结束后触发 Vercel 部署
              if: ${{ env.PROJECT_ID != 'tiptap-docs' }}
              env:
                  VERCEL_DEPLOY_HOOK: ${{ secrets[steps.source.outputs.deploy_hook_secret] }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFile, readFile } from 'node:fs/promises'
                  const hook = process.env.VERCEL_DEPLOY_HOOK
                  if (!hook) {
                      console.log('未配置当前项目的 Vercel Deploy Hook，跳过部署。')
                  } else {
                      const result = JSON.parse(await readFile('.translation-drafts/result.json', 'utf8'))
                      if (result.processed.successful === 0) {
                          console.log('本次没有发布译文，跳过部署。')
                      } else {
                          const response = await fetch(hook, { method: 'POST' }).catch(() => {
                              throw new Error('Vercel 部署请求失败，请检查项目的 Deploy Hook 配置。')
                          })
                          if (!response.ok) throw new Error(`Vercel 部署请求失败：HTTP ${response.status}`)
                          const { job } = await response.json()
                          const message = `翻译处理结束，已触发一次 Vercel 部署，任务：${job.id}`
                          console.log(message)
                          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${message}\n`)
                      }
                  }
                  NODE

            - name: 上传项目报告和进度
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: translation-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      .translation-drafts/result.json
                      .translation-config/progress/
                  include-hidden-files: true
                  if-no-files-found: ignore
                  retention-days: 7
