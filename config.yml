schemaVersion: 1
project:
  id: tiptap-docs
source:
  repository: lin52025iq/tiptap-docs
  ref: main
  branch: tiptap-docs-source
  language: en
targets:
  - locale: zh-CN
    branch: tiptap-docs-zh-cn
    enabled: true
translation:
  model: gpt-6-luna
  scope:
    include:
      - src/**
      - README.md
    exclude: []
  glossary: glossary.yml
  prompts:
    frameworkLanguage: zh-CN
    frameworks: {}
    common: prompts/common.md
  draft:
    pushDraft: false
    remote: origin
  retranslateOnContextChange: false

validation:
  prepare: [pnpm, install, --frozen-lockfile, --ignore-scripts]
  files:
    - include: ['src/**/*.mdx', 'src/**/*.{ts,tsx}']
      cwd: snapshot
      stdin: true
      command: [pnpm, exec, eslint, --quiet, --stdin, --stdin-filename, '{path}']
  global:
    commands:
      - [pnpm, run, generate:content-dates]
      - [pnpm, run, build:next]

deployment:
  provider: vercel
  locale: zh-CN
  name: tiptap-docs
  teamId: team_fEBZtKMNvmjodbBzMmTWage5
  projectId: prj_ce2hFlut8p3i4XVFOpTO3smQ0aka
  repositoryId: '1448072497'
