schemaVersion: 1

project:
    id: your-project
    name: 示例文档项目

# 上游仓库及原文镜像分支。
source:
    repository: owner/docs
    ref: main
    branch: your-project-source
    # 指定语言（如 en），或使用 auto 自动识别；省略时默认 auto。
    language: auto

# 按配置顺序翻译。
targets:
    - locale: zh-CN
      branch: your-project-zh-cn
      enabled: true
      # 提示词书写语言；目标语言由 locale 决定。
      frameworkLanguage: zh-CN
      prompt: prompts/zh-CN.md

translation:
    model: gpt-6-luna
    # 仓库相对路径，exclude 优先。
    scope:
        include:
            - '**/*.md'
            - '**/*.mdx'
            - src/**/*.{js,jsx,ts,tsx,vue}
        exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/*.{test,spec}.{js,jsx,ts,tsx}'
    # 文件路径相对于本配置。
    glossary: glossary.yml
    prompts:
        frameworkLanguage: zh-CN
        # 可增加其他语言框架，缺失时回退中文。
        frameworks: {}
        common: prompts/common.md
    retranslateOnContextChange: false
    # 文件校验失败时归档到 draft 分支。
    draft:
        draftBranch: your-project-draft
        # 单文件命令默认不推送；项目命令使用 --push 统一发布。
        pushDraft: false
        remote: origin

# 项目可配置文件校验规则和可选的全局校验命令。
validation:
    # 已有校验入口可用 cwd: snapshot 在仓库快照中调用。
    # 支持 stdin 的工具可以设置 stdin: true，通过 {path} 传入原相对路径。
    # 自定义脚本默认在配置目录执行，可通过 {file} 读取候选文件。
    files: []
